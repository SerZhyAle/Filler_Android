name: Privacy pages
run-name: Publish site/ to GitHub Pages

# Owner's order of 2026-11-13 (the public presence of Filler, canon store-publish Google Play reference): site/ holds
# the hand-written privacy pages and is published as it is. The check runs on Windows, where the gate is measured, and
# refuses the deploy unless the pages pass; the deploy runs on Linux. The check needs no plugin and no harness.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site/**'
      - 'tools/locale/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      # The pages are LF in the repository; the Windows runner's default core.autocrlf=true would turn them into CRLF on
      # checkout, and the kit's hash is taken over its committed bytes.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Check the site
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/site/check-site.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # S0039: the facts the pages type by hand against the manifests, the locale folders and the build script.
      # FILLER-0071 (REPO-LAYOUT 0.12 rule 8): the two SITE-* contract pointers are local-only and gitignored, so the
      # runner's fresh clone carries no copy; the public scope drops their five patterns, and the default scope would
      # exit 2 there (CHECK-VERDICT rule 13: a skipped declared input is could-not-verify).
      - name: Check the site facts
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/site/check-site-facts.ps1 -Scope public
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # FILLER-0079: every language of tools/locale/locales.json has its pages and documents, and each rendered file is
      # in step with its English source and dictionary.
      - name: Check the languages
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/locale/check-locales.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # S0040: every surface lists the pillars of docs/SPECIFICATION_POSITIONING.md in its order
      - name: Check the positioning order
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/site/check-positioning.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
