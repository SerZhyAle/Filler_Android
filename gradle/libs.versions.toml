# Version catalog. The toolchain pins follow the upstream FastMediaSorter's current values (read-only, on
# 2026-11-10: its gradle/libs.versions.toml, docs/TECH_STACK.md and app_v2/build.gradle.kts). The two
# products share no build: a pin moves here, on its own ticket, never by reference.
# Kotlin is AGP's built-in Kotlin, so it has no entry; its version follows agp.
[versions]
agp = "9.2.1"

# Platform levels. targetSdk equals the upstream's, because the ported code is tested against that
# runtime behaviour; the Play requirement is re-read when a package is about to ship.
compile-sdk = "37"
target-sdk = "37"
min-sdk = "26"

androidx-appcompat = "1.7.1"
google-material = "1.14.0"
junit = "4.13.2"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "google-material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
