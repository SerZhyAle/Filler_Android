<script>
(function(){
  var h=document.documentElement,urls={ru:'https://serzhyale.github.io/Filler_Android/404-ru.html',en:'https://serzhyale.github.io/Filler_Android/404.html',ua:'https://serzhyale.github.io/Filler_Android/404-uk.html'};
  var tb=document.getElementById('themeBtn'),labels={light:'Switch to dark theme',dark:'Switch to light theme'};
  function sync(){tb.setAttribute('aria-label',labels[h.getAttribute('data-theme')==='light'?'light':'dark'])}
  sync();
  tb.addEventListener('click',function(){
    var n=h.getAttribute('data-theme')==='light'?'dark':'light';
    h.setAttribute('data-theme',n);
    try{localStorage.setItem('sza-theme',n)}catch(e){}
    sync();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button[data-lang]'),function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-lang');
      try{localStorage.setItem('sza-lang',k)}catch(e){}
      if(b.getAttribute('aria-pressed')!=='true')location.href=urls[k];
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.locale-row a[data-lang]'),function(a){
    a.addEventListener('click',function(){try{localStorage.setItem('sza-lang',a.getAttribute('data-lang'))}catch(e){}});
  });
})();
</script>
