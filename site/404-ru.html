  <!-- The host serves 404.html for any address it has no page for, at any depth, so every address below is absolute. This
       sibling is a plain page with noindex. PAGE-STYLE section 7: theme and the touch profile are resolved first. -->
  <script>
(function(){try{
  var h=document.documentElement,t=localStorage.getItem('sza-theme');
  if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  h.setAttribute('data-theme',t);
  h.setAttribute('data-ui-profile',matchMedia('(pointer: coarse)').matches?'touch':'pointer');
}catch(e){}})();
  </script>
  <link rel="stylesheet" href="https://serzhyale.github.io/Filler_Android/assets/sza-kit.css">
  <link rel="stylesheet" href="https://serzhyale.github.io/Filler_Android/assets/common.css">

</head>
<body>
<a class="btn btn-primary skip-link" href="#main"><span>Перейти к основному содержимому</span></a>
<div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
<header class="site-header">
  <a class="brand" href="https://serzhyale.github.io/Filler_Android/index-ru.html" aria-label="Filler, главная страница">Filler<span class="dot">.</span></a>
  <div class="seg" role="group" aria-label="Язык">
    <button type="button" data-lang="ru" aria-pressed="true">RU</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
    <button type="button" data-lang="ua" aria-pressed="false">UA</button>
  </div>
  <button type="button" class="theme-btn" id="themeBtn" aria-label="Включить светлую тему"><span class="gi gi-theme" aria-hidden="true"></span><span>Тема</span></button>
</header>
<main class="container section" id="main">
  <noscript><p class="lang-links"><a href="https://serzhyale.github.io/Filler_Android/404.html" hreflang="en">English</a> &middot; <a href="https://serzhyale.github.io/Filler_Android/404-ru.html" hreflang="ru">Русский</a> &middot; <a href="https://serzhyale.github.io/Filler_Android/404-uk.html" hreflang="uk">Українська</a></p></noscript>

<h1 id="not-found">Страница не найдена</h1>

  </div>
</div></footer>
<script>
(function(){
  var h=document.documentElement,urls={ru:'https://serzhyale.github.io/Filler_Android/404-ru.html',en:'https://serzhyale.github.io/Filler_Android/404.html',ua:'https://serzhyale.github.io/Filler_Android/404-uk.html'};
  var tb=document.getElementById('themeBtn'),labels={light:'Включить тёмную тему',dark:'Включить светлую тему'};
  function sync(){tb.setAttribute('aria-label',labels[h.getAttribute('data-theme')==='light'?'light':'dark'])}
  sync();
  tb.addEventListener('click',function(){
    var n=h.getAttribute('data-theme')==='light'?'dark':'light';
    h.setAttribute('data-theme',n);
    try{localStorage.setItem('sza-theme',n)}catch(e){}
    sync();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button[data-lang]'),function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-lang');
      try{localStorage.setItem('sza-lang',k)}catch(e){}
      if(b.getAttribute('aria-pressed')!=='true')location.href=urls[k];
    });
  });
})();
</script>
</body>
</html>
