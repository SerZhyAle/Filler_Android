# Toolchain JDK: build with a JDK 17, 21 or 25 install (the Gradle 9.4.1 / AGP 9.2.1 pair does not run on
# JDK 26). org.gradle.java.home is deliberately NOT set here: it is a machine-specific absolute path.
# Set it per developer in %USERPROFILE%\.gradle\gradle.properties.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true
# Off on purpose: the version stamp reads the clock at configuration time (buildSrc), and a cached
# configuration would replay a stale instant.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
